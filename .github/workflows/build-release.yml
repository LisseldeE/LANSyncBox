name: Build & Release (Pro)

on:
  push:
    tags:
      - 'pro-R*'

permissions:
  contents: write

env:
  APP_NAME: LANSyncBox Pro
  ENTRY: LANSyncBox Pro.py
  WIN_ASSET: LANSyncBoxPro_Setup.exe
  LINUX_ASSET: lansyncboxpro_amd64.deb
  LINUX_PKG: lansyncboxpro
  MAC_ASSET: LANSyncBoxPro_arm64.dmg

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备 Inno Setup 与简体中文语言文件
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          Copy-Item "$env:GITHUB_WORKSPACE\.github\ci\windows\ChineseSimplified.isl" `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\LICENSE" "$env:GITHUB_WORKSPACE\LICENSE.txt" -Force

      - name: 安装依赖
        shell: pwsh
        run: python -m pip install --upgrade pip; pip install "nuitka==4.3.1" "PySide6==6.12.0" certifi comtypes

      - name: Nuitka 打包（目录版）
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^pro-R', ''
          $na = @(
            '-m', 'nuitka',
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--noinclude-pytest-mode=nofollow',
            '--noinclude-setuptools-mode=nofollow',
            '--noinclude-unittest-mode=nofollow',
            '--enable-plugin=pyside6',
            '--include-package=certifi',
            '--include-package-data=certifi',
            '--include-package=comtypes',
            '--msvc=latest',
            '--jobs=4',
            '--remove-output',
            '--output-dir=build\nuitka',
            '--windows-icon-from-ico=icon.ico',
            '--company-name=Lisselde_E',
            '--product-name=LANSyncBox Pro',
            '--file-description=LANSyncBox Pro',
            "--file-version=$ver",
            "--product-version=$ver",
            '--copyright=Copyright (c) 2026 Lisselde_E',
            '--include-data-file=icon.ico=icon.ico',
            $env:ENTRY
          )
          python @na
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup 编译安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver  = $env:GITHUB_REF_NAME -replace '^pro-R', ''
          $src  = Join-Path $env:GITHUB_WORKSPACE "dist"
          $out  = Join-Path $env:GITHUB_WORKSPACE "out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc `
            "/DEdition=pro" `
            "/DAppVersion=$ver" `
            "/DSourceDir=$src" `
            "/DDistDir=$env:GITHUB_WORKSPACE\build\nuitka\LANSyncBox Pro.dist" `
            "/DOutputDir=$out" `
            "/DSetupIcon=$env:GITHUB_WORKSPACE\icon.ico" `
            "/DLicenseFile=$env:GITHUB_WORKSPACE\.github\ci\windows\LICENSE.txt" `
            ".github\ci\windows\app.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/${{ env.WIN_ASSET }}
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install PySide6 certifi pyinstaller

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onedir --name "${{ env.LINUX_PKG }}" \
            --add-data "icon.png:." --add-data "icon.ico:." --distpath dist "${{ env.ENTRY }}"

      - name: 生成 .deb
        run: |
          python .github/ci/linux/build_deb.py \
            --app-name "${{ env.APP_NAME }}" \
            --version "${GITHUB_REF_NAME#pro-R}" \
            --source-dir "dist/${{ env.LINUX_PKG }}" \
            --icon icon.png \
            --package "${{ env.LINUX_PKG }}" \
            --desktop-name "${{ env.APP_NAME }}.desktop" \
            --output "out/${{ env.LINUX_ASSET }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/${{ env.LINUX_ASSET }}
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install PySide6 certifi pyinstaller

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --windowed --icon icon.icns --add-data "icon.icns:." --name "${{ env.APP_NAME }}" "${{ env.ENTRY }}"
          # .app 的版本号注入（PyInstaller 的 BUNDLE 默认写 0.0.0，CLI 无法指定）
          VER="${GITHUB_REF_NAME#pro-R}"
          PLIST="dist/${{ env.APP_NAME }}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VER" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: 生成 .dmg（拖拽安装布局）
        run: |
          pip install dmgbuild
          mkdir -p out

          # 底图随仓库提交：.github/ci/macos/dmg-bg.png（540x360）+ dmg-bg@2x.png（1080x720）
          # dmgbuild 会自动找到同目录的 @2x，用 tiffutil 合成多分辨率 TIFF，Retina 与非 Retina 都清晰
          # dmgbuild 直接写卷内的 .DS_Store，不走 Finder，headless runner 上稳定
          python - <<'PY'
          import dmgbuild

          dmgbuild.build_dmg(
              "out/${{ env.MAC_ASSET }}",
              "${{ env.APP_NAME }}",
              settings={
                  "files": ["dist/${{ env.APP_NAME }}.app"],
                  "symlinks": {"Applications": "/Applications"},
                  "background": ".github/ci/macos/dmg-bg.png",
                  "icon_size": 96,
                  "icon_locations": {
                      "${{ env.APP_NAME }}.app": (140, 180),
                      "Applications": (400, 180),
                  },
                  "window_rect": ((120, 120), (540, 360)),
                  "default_view": "icon-view",
                  "show_status_bar": False,
                  "show_tab_view": False,
                  "show_toolbar": False,
                  "show_pathbar": False,
                  "show_sidebar": False,
              },
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/${{ env.MAC_ASSET }}
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    if: ${{ always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="${APP_NAME}_R${GITHUB_REF_NAME#pro-R}"
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" dist/* --title "$TITLE"
          fi